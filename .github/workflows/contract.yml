name: Global statistics contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: etzhayyim/jp.go.meti.enecho
          ref: cc2d7e4f5400a1d6c06b6d8fa60345e37d8473b2
          path: .sources/jp.go.meti.enecho
      - uses: actions/checkout@v4
        with:
          repository: cloud-itonami/app-itonami-org.worldbank.api
          ref: 04a43f3ec7db5fb00b6e088f87358aa834733723
          path: .sources/org.worldbank.api
      - uses: actions/checkout@v4
        with:
          repository: cloud-itonami/app-itonami-org.ourworldindata
          ref: 0f13c95e5c7827e08ee7db4629adaa4c5e900fe0
          path: .sources/org.ourworldindata
      - uses: actions/checkout@v4
        with:
          repository: cloud-itonami/app-itonami-org.un.unstats
          ref: e4c20495a5c85e3ea36ef8ce495f7b5cf55c9b43
          path: .sources/org.un.unstats
      - uses: actions/checkout@v4
        with:
          repository: cloud-itonami/app-itonami-global-legislation-datoms
          ref: 3849e1ef215420821f9d17fdb6f9a29dec90b406
          path: .joins/app-itonami-global-legislation-datoms
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install NBB query runtime
        run: npm install --no-save --ignore-scripts nbb@1.3.204
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Verify source hashes and git-annex pointers
        run: npx nbb bin/verify-source-catalogs.cljk .sources
      - name: Verify CI source lock
        run: npx nbb bin/verify-ci-lock.cljk
      - name: Rebuild committed projections
        run: npx nbb bin/build.cljk .sources
      - name: Build coverage-quality report
        run: npx nbb bin/build-quality-report.cljk
      - name: Reject stale generated datoms
        run: git diff --exit-code -- data
      - name: Verify the jurisdiction join against the legislation projection
        run: npx nbb bin/verify-jurisdiction-join.cljk .joins/app-itonami-global-legislation-datoms
      - name: Exercise Datascript query contract
        # .cljk sources are invisible to the JVM loader (ADR-2609111500), so
        # the wrapper mirrors them as .cljc into a scratch overlay at runtime
        # (pattern from kotoba's scripts/jvm-cljk-run.sh at the pinned sha).
        # `clojure -Spath` inside it is the classpath half of AWAI-3816.
        run: bin/query-contract-jvm.sh
